<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>刀剣乱舞ぱずぎり 育成管理アプリ</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>刀剣乱舞ぱずぎり 育成管理</h1>
        </div>

        <div class="tabs" id="tabs">
            <button class="tab-btn active" data-tab="characters">キャラ一覧</button>
            <button class="tab-btn" data-tab="drops">ドロップ統計</button>
            <button class="tab-btn" data-tab="materials">素材トラッキング</button>
            <button class="tab-btn" data-tab="inventory">在庫管理</button>
            <button class="tab-btn" data-tab="settings">設定</button>
        </div>

        <div id="characters" class="tab-content active"></div>
        <div id="drops" class="tab-content"></div>
        <div id="materials" class="tab-content"></div>
        <div id="inventory" class="tab-content"></div>
        <div id="settings" class="tab-content"></div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/features/characters.js"></script>
    <script src="js/features/drops.js"></script>
    <script src="js/features/materials.js"></script>
    <script src="js/features/inventory.js"></script>
    <script src="js/features/settings.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
